name: Update add-ons

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Update add-ons to the latest upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          registry_file="addons.json"
          test -f "${registry_file}"
          jq -e '.addons | type == "array"' "${registry_file}" >/dev/null
          update_file="${RUNNER_TEMP}/addon-updates"
          : > "${update_file}"
          while IFS= read -r addon; do
            addon_dir="$(jq -r '.path' <<<"${addon}")"
            release_repository="$(jq -r '.release_repository' <<<"${addon}")"
            image_repository="$(ruby -r yaml -e 'puts YAML.load_file(ARGV[0]).fetch("image")' "${addon_dir}/config.yaml")"
            case "${image_repository}" in
              ghcr.io/*)
                registry="ghcr"
                image_name="${image_repository#ghcr.io/}"
                ;;
              *)
                registry="dockerhub"
                image_name="${image_repository}"
                ;;
            esac
            current="$(ruby -r yaml -e 'puts YAML.load_file(ARGV[0]).fetch("version")' "${addon_dir}/config.yaml")"
            release_tag="$(curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${release_repository}/releases/latest" \
              | jq -r '.tag_name')"
            test -n "${release_tag}" && test "${release_tag}" != "null"
            candidates=("${release_tag}")
            case "${release_tag}" in
              v*) candidates+=("${release_tag#v}") ;;
              *) candidates+=("v${release_tag}") ;;
            esac
            image_tag=""
            for candidate in "${candidates[@]}"; do
              case "${registry}" in
                dockerhub)
                  status="$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' \
                    "https://registry.hub.docker.com/v2/repositories/${image_name}/tags/${candidate}")"
                  ;;
                ghcr)
                  token="$(curl --fail --silent --show-error --max-time 20 \
                    "https://ghcr.io/token?service=ghcr.io&scope=repository:${image_name}:pull" | jq -r '.token')"
                  status="$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' \
                    -H "Authorization: Bearer ${token}" \
                    -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
                    "https://ghcr.io/v2/${image_name}/manifests/${candidate}")"
                  ;;
                *)
                  echo "Unsupported registry: ${registry}" >&2
                  exit 1
                  ;;
              esac
              if [ "${status}" = "200" ]; then
                image_tag="${candidate}"
                break
              fi
            done
            if [ -z "${image_tag}" ]; then
              echo "${addon_dir}: no matching image tag found for release ${release_tag}" >&2
              continue
            fi
            if [ "${image_tag}" = "${current}" ]; then
              echo "${addon_dir}: ${current} is already current"
              continue
            fi
            sed -i -E "s/^version: \"[^\"]+\"/version: \"${image_tag}\"/" "${addon_dir}/config.yaml"
            printf '%s|%s|%s\n' "${addon_dir}" "${current}" "${image_tag}" >> "${update_file}"
            echo "${addon_dir}: updated ${current} -> ${image_tag} (release ${release_tag})"
          done < <(jq -c '.addons[]' "${registry_file}")

      - name: Commit and push the update
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          update_file="${RUNNER_TEMP}/addon-updates"
          update_count="$(wc -l < "${update_file}" | tr -d ' ')"
          if [ "${update_count}" -eq 1 ]; then
            title="chore: update $(cut -d'|' -f1 "${update_file}")"
          else
            title="chore: update add-on upstream versions"
          fi
          {
            printf '%s\n\n' "${title}"
            awk -F'|' '{printf "- %s: %s -> %s\n", $1, $2, $3}' "${update_file}"
          } > "${RUNNER_TEMP}/commit-message"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add addons.json -- '*'/config.yaml
          git commit --file "${RUNNER_TEMP}/commit-message"
          git push origin "HEAD:${GITHUB_REF_NAME}"
